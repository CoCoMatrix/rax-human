schema: xpolicylab.piper-deployment/v1
name: junqi-pi05-pen-trash-baseline
label: Junqi independent Pi0.5 dual-PiPER pen-trash EMA 9999 baseline
release:
  status: hardware_free_candidate
bundle:
  kind: pytorch_safetensors
  default_path: /home/ubuntu/code_junqi/model-store/models/pi05/pen-trash-dual-piper-real-h32-v1-ema-v1/step-9999
  required: [checkpoint/model.safetensors, contract.json, deploy_input.json, package_manifest.json]
  verifier: policy/Pi_05/verify_piper_pen_trash_h32_v1_ema9999_bundle.py
policy:
  action_frequency_hz: 30
  action_horizon: 32
  default_execute_chunk: 16
  default_execute_mode: auto
observation:
  camera_profile: runtime/robot_dagger/config/camera_profiles/piper-x-dual-rgb-1280x720-30.yml
server:
  default_mode: managed
  script: policy/Pi_05/serve_junqi_pi05_pen_trash_baseline.sh
operator:
  default_control_source: keyboard
  keyboard_graph: runtime/robot_dagger/graphs/piper-x-dual-policy-30hz-keyboard.yml
  dagger_graph: runtime/robot_dagger/graphs/piper-x-dual-policy-30hz-dagger.yml
  ui_enabled: true
tasks:
  default: Pick up one pen and place it in the trash bin.
  inline:
    - Close the laptop.
    - Pick up one drink container and place it on the coaster.
    - Pick up one mouse and place it on the mouse pad.
    - Pick up one pen and place it in the pen holder.
    - Pick up one pen and place it in the trash bin.
    - Pick up all paper balls and place them in the trash bin.
  catalog_path: "{repo_root}/policy/Pi_05/piper_pen_trash_task_catalog.json"
pigey:
  supported: false
setup:
  script: policy/Pi_05/setup_junqi_pi05_pen_trash_baseline.sh
qualification:
  supported: true
  verifier: policy/Pi_05/verify_piper_pen_trash_h32_v1_ema9999_bundle.py
  verifier_args: [--full-manifest]
  uv: /home/ubuntu/miniconda3/envs/infra/bin/uv
  server_timeout_seconds: 600
  image_width: 1280
  image_height: 720
  tests:
    - tests/test_pi05_piper_pen_trash_h32_v1.py
    - tests/test_pi05_piper_h32_ema.py
    - tests/test_piper_qualification.py
  smoke_script: policy/Pi_05/smoke_piper_pen_trash_h32_v1_ema9999.py
