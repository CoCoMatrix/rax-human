schema: xpolicylab.piper-deployment/v1
name: junqi-cup-native-rtc-instance02
label: Junqi BAT2 native-prefix RTC - offline candidate only
robot:
  device_instance: runtime/robot_dagger/config/robot_instances/piper_x_dual_02.yml
release:
  status: hardware_free_candidate
bundle:
  kind: jax_orbax
  default_path: /home/ubuntu/code_junqi/model-store/models/pi05/cup_switch_bat00000002_pi05_trainingrtc_ema_step1000_from2000_ckpt
  required: [checkpoint/params, checkpoint/assets, contract.json, deploy_input.json, package_manifest.json, infer.py]
  verifier: policy/Pi05CupNativeRTC02/verify_bundle.py
policy:
  action_frequency_hz: 30
  action_horizon: 50
  default_execute_chunk: 10
  default_execute_mode: fixed
observation:
  camera_profile: runtime/robot_dagger/config/camera_profiles/piper-x-dual-rgb-1280x720-30.yml
server:
  default_mode: managed
  script: policy/Pi05CupNativeRTC02/serve.sh
operator:
  default_control_source: keyboard
  keyboard_graph: runtime/robot_dagger/graphs/piper-x-dual-policy-30hz-keyboard.yml
  ui_enabled: true
tasks:
  default: 把杯子从桌面拿起并移向杯架；当杯垫进入桌面区域时，改为将杯子放到杯垫上。
  inline:
    - 把杯子从桌面拿起并移向杯架；当杯垫进入桌面区域时，改为将杯子放到杯垫上。
  catalog_path: "{repo_root}/policy/Pi05CupSwitchRTC02/task_catalog.json"
pigey:
  supported: false
setup:
  script: policy/Pi05CupSwitchRTC02/setup.sh
qualification:
  supported: true
  verifier: policy/Pi05CupNativeRTC02/verify_bundle.py
  verifier_args: [--full-manifest]
  uv: /home/ubuntu/miniconda3/envs/infra/bin/uv
  server_timeout_seconds: 600
  image_width: 1280
  image_height: 720
  tests:
    - tests/test_native_prefix_acceptance.py
    - tests/test_junqi_training_prefix_adapter.py
    - tests/test_native_ui_guard.py
