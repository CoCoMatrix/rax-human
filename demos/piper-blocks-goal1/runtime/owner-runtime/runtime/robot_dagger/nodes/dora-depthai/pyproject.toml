[project]
name = "dora-depthai"
version = "0.0.0"
authors = [{ name = "Your Name", email = "email@email.com" }]
description = "dora-depthai"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
  "depthai==3.0.0",
  "dora-rs==0.5.0",
  "opencv-python>=4.12.0.88",
  "pytz",
]

[project.scripts]
dora-depthai = "dora_depthai.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
