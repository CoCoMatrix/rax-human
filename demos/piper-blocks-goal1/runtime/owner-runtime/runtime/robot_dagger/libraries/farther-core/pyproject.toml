[project]
name = "farther-core"
version = "0.0.0"
authors = [{ name = "Your Name", email = "email@email.com" }]
description = "farther_core"
# license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "livekit==1.0.23",
    "livekit-api",
    "msgpack>=1.1.1",
    "msgpack-numpy>=0.4.8",
    "numpy <3",
    "pyarrow>=14",
    "python-dotenv>=1.1.1",
    "requests",
    "uvloop",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "nbdime>=4.0.2",
    "nbformat>=5.10.4",
    "pre-commit>=4.2.0",
    "pyright>=1.1.402",
    "pytest>=8.4.1",
    "pytest-benchmark>=5.1.0",
    "ruff>=0.12.1",
]

[tool.uv]
default-groups = ["dev"]
prerelease = "if-necessary-or-explicit"

[[tool.uv.index]]
name = "internal"
url = "https://nexus.fftaicorp.com/repository/pypi/simple"
default = true

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
